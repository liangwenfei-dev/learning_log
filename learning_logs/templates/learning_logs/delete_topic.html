{% extends "learning_logs/base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <h3 class="text-danger">确认删除</h3>
        <p>你确定要删除主题 <strong>"{{ object }}"</strong>吗？</p>
        <p class="text-muted small">注意：删除主题后，该主题下的所有笔记会一并移入回收站，之后仍可在回收站恢复。</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger mt-3">确认删除</button>
            <a href="{% url 'learning_logs:index' %}" class="btn btn-secondary mt-3">取消</a>
        </form>
    </div>
</div>
{% endblock content %}
