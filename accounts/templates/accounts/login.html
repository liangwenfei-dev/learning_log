{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<!-- 使用 position-absolute 强制铺满屏幕，或者用 vw 宽度 -->
<div class="d-flex justify-content-center align-items-center" 
     style="min-height: 75vh; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); border-radius: 15px; margin-top: 20px; width: 100%;">
     
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0" style="border-radius: 15px; overflow: hidden;">
            
            <div class="card-header bg-primary text-white text-center py-3" style="border-bottom: none;">
                <h4 class="mb-0 fw-bold">登录 Learning Log</h4>
            </div>
            
            <div class="card-body p-4 bg-white">
                {% if form.errors %}
                <div class="alert alert-danger py-2">
                    用户名或密码不正确，请重试。
                </div>
                {% endif %}
                
                <form action="{% url 'accounts:login' %}" method="post">
                    {% csrf_token %}
                    
                    {% bootstrap_form form %}
                    
                    <button name="submit" class="btn btn-primary w-100 mt-4 py-2 fw-bold">登 录</button>
                </form>
            </div>
            
            <div class="card-footer bg-light text-center py-3">
                <small class="text-muted">还没有账号？ <a href="{% url 'accounts:register' %}">立即注册</a></small>
            </div>
            
        </div>
    </div>
</div>
{% endblock content %}
