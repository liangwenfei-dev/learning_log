{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container mt-4" style="max-width:600px;">
    <h2 class="mb-4">个人资料</h2>
    <div class="card p-4">
        <div class="text-center mb-4">
            {% if profile.avatar %}
                <img src="{{ profile.avatar.url }}" alt="头像" style="width:120px;height:120px;border-radius:50%;object-fit:cover;">
            {% else %}
                <i class="bi bi-person-circle" style="font-size:120px;color:#666;"></i>
                <p class="mt-2">暂无头像</p>
            {% endif %}
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% bootstrap_form form %}
            {% bootstrap_button "保存头像" button_type="submit" button_class="btn-primary w-100" %}
        </form>
    </div>
</div>
{% endblock %}
