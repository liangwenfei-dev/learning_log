{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}
{% block content %}
<div class="d-flex justify-content-center align-items-center"
        style="min-height: 80vh;background: linear-gradient(135deg,#a8edea 0%,#fed6e3 100%);border-radius: 15px;margin-top: 20px;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0" style="border-radius: 15px;overflow: hidden;">
            <div class="card-header bg-primary text-white text-center py-3" style="border-bottom: none;">
                <h4 class="mb-0 fw-bold">注册LearningLog</h4>
            </div>
            <div class="card-body p-4 bg-white">
                <form action="{% url 'accounts:register' %}" method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <button name="submit" class="btn btn-success w-100 mt-3 py-2 fw-bold">注册</button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <small class="text-muted">已经有账号？ <a href="{% url 'accounts:login' %}">去登录</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
