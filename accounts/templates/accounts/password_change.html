{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <!-- 把卡片背景改成自适应 -->
        <div class="card shadow-lg border-0" style="border-radius: 15px; overflow: hidden;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">🔐 修改密码</h4>
            </div>
            <!-- 注意这里：把 bg-white 换成 text-body -->
            <div class="card-body p-4 text-body">
                <form method="post">
                    {% csrf_token %}
                    <!-- Bootstrap 5 会自动帮表单内的标签变色 -->
                    {% bootstrap_form form %}
                    <button type="submit" class="btn btn-primary w-100 mt-3">确认修改</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'learning_logs:profile' %}" class="link-primary">返回个人主页</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
